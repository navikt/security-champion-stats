server:
  port: 8080

spring:
  application:
    name: security-champion-stats-local
  datasource:
    url: jdbc:postgresql://localhost:5432/security_champion_stats
    username: security
    password: champion
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true
      minimum-idle: 2
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    token-validation:
      url: http://localhost:8080/internal/local-auth/introspect
      identity-provider: entra_local
      groups: local-admin-group


graph:
  apiUrl: http://localhost:8081/mock/graph
slack:
  channel-participation:
    enabled: false
    cron: "-"
  membership:
    enabled: false
    cron: "-"
  token: ${SLACK_TOKEN:}
  sc-channel-id: ${SLACK_SC_CHANNEL_ID:}
  scoring:
    cron: "-"
