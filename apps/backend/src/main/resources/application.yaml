server:
  shutdown: graceful
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal
    endpoint:
      security:
        enabled: 'false'
      health:
        show-details: always

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    token-validation:
      url: ${NAIS_TOKEN_INTROSPECTION_ENDPOINT}
      identity-provider: entra_id
      groups: d633d27b-a470-4b9d-984e-85499f126e18
  profiles:
    active: prod
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${NAIS_DATABASE_SECURITY_CHAMPION_STATS_BACKEND_SECURITY_CHAMPION_STATS_DB_JDBC_URL}
    username: ${NAIS_DATABASE_SECURITY_CHAMPION_STATS_BACKEND_SECURITY_CHAMPION_STATS_DB_USERNAME}
    password: ${NAIS_DATABASE_SECURITY_CHAMPION_STATS_BACKEND_SECURITY_CHAMPION_STATS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true
      minimum-idle: 2
      maximum-pool-size: 10
      leak-detection-threshold: 600000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never


slack:
    token: ${SLACK_TOKEN}
    sc-channel-id: ${SLACK_SC_CHANNEL_ID}

delta:
  events:
    enabled: ${DELTA_EVENTS_ENABLED:false}
    category-id: ${DELTA_EVENTS_CATEGORY_ID:54}
  scoring:
    enabled: ${DELTA_SCORING_ENABLED:false}
  api:
    base-url: ${DELTA_API_BASE_URL:http://delta-backend.delta.svc.cluster.local}
    target: ${DELTA_API_TARGET:prod-gcp:delta:delta-backend}

graph:
    apiUrl: https://graph.microsoft.com/v1.0

playbook:
  events:
    enabled: ${PLAYBOOK_EVENTS_ENABLED:false}
    feed-url: ${PLAYBOOK_EVENTS_FEED_URL:https://sikkerhet.nav.no/events.json}

springdoc:
  api-docs:
    enabled: true
