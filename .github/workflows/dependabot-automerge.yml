name: Automerge Dependabot PRs

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to merge PRs
      pull-requests: read # Required for private/internal repos
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@2c57e8fdb262ad558901e1242c89b19346e3a7a1 # v1.7.0
        with:
          token: ${{ github.token }}