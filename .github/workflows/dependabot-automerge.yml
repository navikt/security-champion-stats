name: Automerge Dependabot PRs

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to merge PRs
      pull-requests: read # Required for private/internal repos
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@09f5db3dd1413c6de20825c6b6c3e1cb682c92de # v1.6.0
        with:
          token: ${{ github.token }}